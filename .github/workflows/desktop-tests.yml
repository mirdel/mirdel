name: Desktop Tests

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/desktop/**"
      - "packages/shared/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/desktop/**"
      - "packages/shared/**"

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Desktop Core Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop
