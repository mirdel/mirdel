name: Desktop Tests

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/applet-core/**"
      - "packages/desktop/**"
      - "packages/markdown-to-plain/**"
      - "packages/shared/**"
      - "packages/tts-edge/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/applet-core/**"
      - "packages/desktop/**"
      - "packages/markdown-to-plain/**"
      - "packages/shared/**"
      - "packages/tts-edge/**"

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Desktop Core Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore sqlite extension cache
        uses: actions/cache@v4
        with:
          path: packages/desktop/.runtime/.cache/sqlite-extensions
          key: sqlite-extension-darwin-arm64-${{ hashFiles('packages/desktop/scripts/prepare-sqlite-extension-runtime.mjs') }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop
