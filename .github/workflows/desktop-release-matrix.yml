name: Desktop Release Matrix

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            runner: macos-15
            runtime_target: darwin-arm64
            electron_builder_args: --mac dmg zip --arm64
          - id: mac-x64
            runner: macos-15-intel
            runtime_target: darwin-x64
            electron_builder_args: --mac dmg zip --x64
          - id: win-x64
            runner: windows-latest
            runtime_target: win32-x64
            electron_builder_args: --win nsis --x64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Restore llama runtime cache
        uses: actions/cache@v5
        with:
          path: packages/desktop/.runtime/.cache/model-server
          key: llama-runtime-${{ matrix.runtime_target }}-${{ hashFiles('packages/desktop/scripts/prepare-model-server-runtime.mjs') }}

      - name: Restore python runtime cache
        uses: actions/cache@v5
        with:
          path: packages/desktop/.runtime/.cache/python
          key: python-runtime-${{ matrix.runtime_target }}-${{ hashFiles('packages/desktop/scripts/prepare-python-runtime.mjs') }}

      - name: Restore sqlite extension cache
        uses: actions/cache@v5
        with:
          path: packages/desktop/.runtime/.cache/sqlite-extensions
          key: sqlite-extension-${{ matrix.runtime_target }}-${{ hashFiles('packages/desktop/scripts/prepare-sqlite-extension-runtime.mjs') }}

      - name: Validate tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$APP_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match app version ($APP_VERSION)"
            exit 1
          fi

      - name: Package desktop app (macOS)
        if: startsWith(matrix.runtime_target, 'darwin-')
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
          ELECTRON_BUILDER_ARGS: ${{ matrix.electron_builder_args }}
          ELECTRON_BUILDER_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @mirdel/desktop run release:target

      - name: Verify macOS signature
        if: startsWith(matrix.runtime_target, 'darwin-')
        run: |
          set -euo pipefail
          RUNTIME_TARGET="${{ matrix.runtime_target }}"
          ARCH="${RUNTIME_TARGET#darwin-}"
          APP_PATH="packages/desktop/release/mac-${ARCH}/Mirdel.app"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.log
          if grep -q "Signature=adhoc" codesign.log; then
            echo "macOS app was signed ad-hoc, expected Developer ID Application"
            exit 1
          fi
          if ! grep -q "Authority=Developer ID Application:" codesign.log; then
            echo "macOS app is missing Developer ID Application authority"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Package desktop app (Windows)
        if: ${{ !startsWith(matrix.runtime_target, 'darwin-') }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
          ELECTRON_BUILDER_ARGS: ${{ matrix.electron_builder_args }}
          ELECTRON_BUILDER_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @mirdel/desktop run release:target

      - name: Show packaged files
        run: ls -lah packages/desktop/release

      - name: Upload mac update feed fragment
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.runtime_target, 'darwin-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp packages/desktop/release/latest-mac.yml "packages/desktop/release/latest-mac-${{ matrix.id }}.yml"
          gh release upload "$GITHUB_REF_NAME" "packages/desktop/release/latest-mac-${{ matrix.id }}.yml" --clobber

  merge-mac-update-feed:
    name: Merge mac update feed
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download arm64 mac update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern latest-mac-mac-arm64.yml --dir .mac-feed

      - name: Download x64 mac update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern latest-mac-mac-x64.yml --dir .mac-feed

      - name: Merge latest-mac.yml
        run: |
          node packages/desktop/scripts/merge-mac-update-feed.mjs \
            --arm64=.mac-feed/latest-mac-mac-arm64.yml \
            --x64=.mac-feed/latest-mac-mac-x64.yml \
            --output=.mac-feed/latest-mac.yml

      - name: Upload merged latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" .mac-feed/latest-mac.yml --clobber

      - name: Remove temporary mac update feed fragments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" latest-mac-mac-arm64.yml --yes || true
          gh release delete-asset "$GITHUB_REF_NAME" latest-mac-mac-x64.yml --yes || true
